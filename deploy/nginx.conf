# Portraits are immutable: a given id at a given size is the same bytes forever.
# A correction is a re-render under the same id and an explicit purge, not a
# silent replacement. So everything under /portraits/ is cacheable for a year.
#
# Nothing here sets Vary. Cloudflare discards Vary except Accept-Encoding, and a
# response cached under a key that lost part of its meaning is worse than one
# that was never cached.

server {
    listen 80;
    server_name _;
    root /www;
    index index.html;

    # Already-compressed bytes; compressing them again spends CPU to grow them.
    gzip off;
    etag on;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    # `alias`, not `root`, so these live at the same paths as in the data image
    # and the two images share the layer.
    location /portraits/ {
        alias /portraits/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # Records change when a name is corrected, so they revalidate rather than pin.
    location /people/ {
        alias /people/;
        # A location-level `types` replaces the inherited map for this location,
        # so .json is restated alongside the .jsonl nobody's mime.types knows.
        types { application/json json jsonl; }
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    location /site/ {
        add_header Cache-Control "public, max-age=3600" always;
    }

    # `index index.html` redirects / internally to /index.html, so a rule on `= /`
    # alone never reaches the response that is actually sent.
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Every error path is no-store. A 503 that inherited `immutable` would let a
    # CDN pin a two-second outage for a year.
    error_page 404 = @notfound;
    location @notfound {
        add_header Content-Type text/plain always;
        add_header Cache-Control "no-store" always;
        return 404 "not found\n";
    }
}
