# The public images on GHCR.
#
#   ghcr.io/<owner>/sigils-people:serve   nginx, runnable, right headers
#   ghcr.io/<owner>/sigils-people:data    FROM scratch, the files only
#
# These MUST be public packages. GitHub Packages gives a free plan 500 MB of
# storage for *private* packages, shared with Actions artifacts; these are
# ~650 MB each and would blow that on the first push. Public packages are free
# and unlimited. Package visibility is separate from repository visibility and is
# not settable from here — set it once, per package, under
# Packages → sigils-people → Package settings → Change visibility.
name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "Dockerfile"
      - "deploy/**"
      - "portraits/**"
      - "people/**"
      - "index.html"
      - "site/**"
      - ".github/workflows/image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [data, serve]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
            suffix=
          tags: |
            type=raw,value=${{ matrix.target }}
            type=raw,value=${{ matrix.target }}-{{date 'YYYYMMDD'}}
            type=semver,pattern={{version}},suffix=-${{ matrix.target }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: The served image must answer with the headers it promises
        run: |
          docker run -d --name sp -p 8080:80 ghcr.io/${{ github.repository }}:serve
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/healthz >/dev/null && break
            sleep 1
          done
          h=$(curl -sI http://127.0.0.1:8080/portraits/s/ad-01.avif)
          echo "$h"
          echo "$h" | grep -qi '^content-type: image/avif'          || { echo "::error::wrong content type"; exit 1; }
          echo "$h" | grep -qi 'cache-control:.*immutable'          || { echo "::error::not immutable"; exit 1; }
          echo "$h" | grep -qi '^vary:'                             && { echo "::error::Vary on a cacheable response"; exit 1; }
          curl -sI http://127.0.0.1:8080/portraits/s/zz-99.avif | grep -qi 'cache-control: no-store' \
            || { echo "::error::an error path is cacheable"; exit 1; }
          echo "headers ok"
