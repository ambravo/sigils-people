# The gallery on GitHub Pages.
#
# Pages has a 1 GB soft limit on site size and this site is most of the way there
# already, so the size is asserted before upload: better to fail here, with a
# number, than to be told by GitHub later. If it trips, the fix is to stop
# publishing `portraits/l` from Pages and point the gallery's 1024 px links at
# the container instead — the site itself only ever loads s and m.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "site/**"
      - "people/**"
      - "portraits/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the records before publishing them
        run: python3 check.py

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r site people portraits _site/
          # A .nojekyll stops Pages trying to process 198 .jsonl files.
          touch _site/.nojekyll

      - name: Refuse to publish a site that is about to hit the limit
        run: |
          bytes=$(du -sb _site | cut -f1)
          mb=$((bytes / 1000000))
          echo "site is ${mb} MB"
          if [ "$mb" -gt 900 ]; then
            echo "::error::_site is ${mb} MB, against a 1 GB Pages limit. Stop publishing portraits/l from Pages." >&2
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
